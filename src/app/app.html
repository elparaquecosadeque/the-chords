<div class="shell" [attr.data-theme]="preferences.theme()">
  <header class="topbar">
    <nav class="tool-nav" [attr.aria-label]="copy().navLabel">
      <a routerLink="/chord-finder" routerLinkActive="active" ariaCurrentWhenActive="page">
        {{ copy().chordFinder }}
      </a>
      <a routerLink="/circle-of-fifths" routerLinkActive="active" ariaCurrentWhenActive="page">
        {{ copy().circleOfFifths }}
      </a>
    </nav>

    <a class="brand" routerLink="/chord-finder" [attr.aria-label]="copy().homeLabel">
      The Chords
    </a>

    <div class="preferences">
      <button
        type="button"
        role="switch"
        [attr.aria-checked]="preferences.theme() === 'dark'"
        [attr.aria-label]="preferences.theme() === 'dark' ? copy().darkTheme : copy().lightTheme"
        (click)="toggleTheme()"
      >
        <span aria-hidden="true">{{ preferences.theme() === 'dark' ? '☾' : '☀' }}</span>
        {{ preferences.theme() === 'dark' ? copy().darkTheme : copy().lightTheme }}
      </button>
      <button
        type="button"
        role="switch"
        [attr.aria-checked]="preferences.language() === 'es'"
        [attr.aria-label]="copy().language"
        (click)="toggleLanguage()"
      >
        {{ preferences.language() | uppercase }}
      </button>
    </div>
  </header>

  <main class="tool-content">
    <router-outlet />
  </main>

  <footer class="site-footer">
    <div class="footer-links">
      <a
        class="repository-link"
        href="https://github.com/elparaquecosadeque/the-chords"
        target="_blank"
        rel="noopener noreferrer"
      >
        {{ copy().repository }}
      </a>

      <nav class="social-links" [attr.aria-label]="copy().socialLinks">
        <a
          href="https://github.com/elparaquecosadeque"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="copy().githubProfile"
          [attr.title]="copy().githubProfile"
        >
          <i class="fa-brands fa-github" aria-hidden="true"></i>
        </a>
        <a
          href="https://www.linkedin.com/in/gerardoleon-97/"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="copy().linkedinProfile"
          [attr.title]="copy().linkedinProfile"
        >
          <i class="fa-brands fa-linkedin" aria-hidden="true"></i>
        </a>
      </nav>
    </div>

    <p>
      {{ copy().attribution }}
      <a
        href="https://www.linkedin.com/in/gerardoleon-97/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Bruno Leon
      </a>
    </p>
  </footer>
</div>
