<div class="metronome">
  <button
    type="button"
    class="metronome-toggle"
    [class.playing]="isPlaying()"
    [class.accent]="accentPulse()"
    [style.--metronome-beat]="beatSeconds()"
    [attr.aria-pressed]="isPlaying()"
    [attr.aria-label]="isPlaying() ? text().metronome.pause : text().metronome.play"
    (click)="toggle()"
  >
    <span class="metronome-icon" [class.icon-play]="!isPlaying()" aria-hidden="true">{{ isPlaying() ? '⏸' : '▶' }}</span>
  </button>
  <label class="metronome-bpm-label">
    <input
      class="metronome-bpm"
      type="number"
      min="40"
      max="240"
      [attr.aria-label]="text().metronome.bpmLabel"
      [value]="bpmInputValue()"
      (input)="onBpmInput($any($event.target).value)"
      (blur)="onBpmBlur()"
    />
    <span aria-hidden="true">{{ text().metronome.bpmUnit }}</span>
  </label>
  <label class="metronome-bpm-label metronome-time-sig-label">
    <select
      class="metronome-time-sig"
      [attr.aria-label]="text().metronome.timeSignatureLabel"
      (change)="onTimeSignatureChange($any($event.target).value)"
    >
      @for (ts of timeSignatures; track ts.label) {
        <option [value]="ts.beats" [selected]="ts.beats === beatsPerMeasure()">{{ ts.label }}</option>
      }
    </select>
    <span aria-hidden="true">▾</span>
  </label>
  <div class="metronome-volume">
    <button
      type="button"
      class="metronome-toggle"
      [attr.aria-expanded]="volumeOpen()"
      aria-haspopup="true"
      aria-controls="metronome-volume-pop"
      [attr.aria-label]="text().metronome.volumeLabel"
      (click)="toggleVolumePopover()"
    >
      <svg class="volume-icon" viewBox="0 0 24 24" aria-hidden="true">
        <polygon points="3 9 3 15 8 15 13 20 13 4 8 9 3 9" />
        @if (volume() > 0.02) {
          <path d="M16.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        }
        @if (volume() > 0.5) {
          <path d="M19.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        }
      </svg>
    </button>
    @if (volumeOpen()) {
      <div id="metronome-volume-pop" class="metronome-volume-popover" role="group" [attr.aria-label]="text().metronome.volumeLabel">
        <input
          type="range"
          class="metronome-volume-slider"
          min="0"
          max="100"
          [value]="volume() * 100"
          (input)="onVolumeInput($any($event.target).value)"
          [attr.aria-label]="text().metronome.volumeLabel"
        />
      </div>
    }
  </div>
</div>
