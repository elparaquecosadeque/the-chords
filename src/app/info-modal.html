@if (open()) {
  <div class="info-backdrop" (click)="onBackdropClick($event)">
    <div class="info-panel" role="dialog" aria-modal="true" aria-labelledby="info-modal-title">
      <header class="info-panel-header">
        <h2 id="info-modal-title">{{ text().infoModal.buttonLabel }}</h2>
        <button #closeButton type="button" class="info-close" [attr.aria-label]="text().infoModal.close" (click)="close()">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
      </header>
      <div class="info-panel-body">
        @for (section of sections(); track section.title) {
          <section class="info-section">
            <h3>{{ section.title }}</h3>
            <p>{{ section.body }}</p>
          </section>
        }
      </div>
    </div>
  </div>
}
